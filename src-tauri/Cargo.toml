[package]
name = "tauri-canvas-shell"
version = "0.1.0"
description = "Empty Tauri v2 desktop shell featuring a canvas-embedded sidebar and modern transitions"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tauri_canvas_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[lints.rust]
unsafe_code = "forbid"
